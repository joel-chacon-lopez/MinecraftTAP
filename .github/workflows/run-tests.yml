name: Run Unit Tests

on:
  push:
    branches:
      - main  # Ejecutar los tests en la rama principal
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$(pwd)/AdventuresInMinecraft-PC-master/MinecraftAgentFramework" >> $GITHUB_ENV

    - name: Run Base Agent Test
        run: python -m unittest AdventuresInMinecraft-PC-master/MinecraftAgentFramework/tests/test_base_agent.py

    - name: Run Insult Bot Test
      run: python -m unittest AdventuresInMinecraft-PC-master/MinecraftAgentFramework/tests/test_insult_bot.py

    - name: Run Oracle Bot Test
      run: python -m unittest AdventuresInMinecraft-PC-master/MinecraftAgentFramework/tests/test_oracle_bot.py

    - name: Run TNT Bot Test
      run: python -m unittest AdventuresInMinecraft-PC-master/MinecraftAgentFramework/tests/test_tnt_bot.py
